# Two numbers, because two repositories publish the toolchain and they do not
# move together. `plugin` is the Gradle plugin, the linter and the `coderpack`
# command line, released by `ancaria-dev/build`. `api` is the artifact a mod
# compiles against, released by `ancaria-dev/coderpack`. They used to be one
# entry, which was true only while the two repositories happened to be on the
# same number.
[versions]
plugin = "0.200.0"
api = "0.200.0"

[plugins]
coderpack = { id = "dev.ancaria.coderpack", version.ref = "plugin" }
