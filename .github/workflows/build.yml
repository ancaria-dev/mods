name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The release gate asks the remote which mod tags already exist.
          fetch-depth: 0
          # The index step below pushes the file it regenerates, so the token
          # has to stay in the git config after the checkout. This is the
          # default; it is written out because a run that loses it fails in the
          # push rather than in the checkout.
          persist-credentials: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # assembleSacredMod runs the linter over every jar before it copies one
      # anywhere, so a mod that the loader would skip fails here rather than in
      # somebody's game. The plugin resolves from the Gradle Plugin Portal and
      # the API from Maven Central, per settings.gradle.kts.
      - name: Build every mod
        run: ./gradlew assembleSacredMod --no-daemon

      # Pinned in dependencies.json rather than "latest": a bad build release
      # should not be able to break every mod's CI on its own schedule. Bump
      # the pin in a normal PR when there is a reason to move.
      - name: Get the coderpack command line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '.[] | select(.path=="ancaria-dev/build") | .version' dependencies.json)
          gh release download "v$version" --repo ancaria-dev/build \
            --pattern 'coderpack-*.zip' --dir .coderpack
          unzip -q .coderpack/coderpack-*.zip -d .coderpack
          echo "$PWD/$(echo .coderpack/coderpack-*/bin)" >> "$GITHUB_PATH"

      # The index is generated and committed, because a launcher reads it
      # straight out of this repository. Keeping it in step by hand is a chore
      # that only reports itself afterwards, in a red build, so on master the
      # workflow writes it and commits it.
      #
      # What it must describe is the jar behind each download URL, not the jar
      # this run happened to build. Those two are the same for a version being
      # released now and different for one released earlier whose sources have
      # moved since, and the launcher refuses a download whose sha256 is not the
      # one the index published. So a mod whose tag already exists is indexed
      # from the asset on that release, and only a version with no tag yet is
      # indexed from the jar just built, which is the jar the release step below
      # is about to attach to it.
      #
      # The staged jars are handed to `coderpack index --jars` rather than the
      # generated file being edited afterwards, so the file is always written by
      # the generator and its formatting cannot drift.
      - name: Regenerate the index and commit it
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # A first pass, only to learn which mods exist and at which versions.
          coderpack index --out .index-probe.json
          mkdir -p .index-jars
          for id in $(jq -r '.mods[].id' .index-probe.json); do
            entry=$(jq -r ".mods[] | select(.id == \"$id\")" .index-probe.json)
            version=$(echo "$entry" | jq -r .version)
            file=$(echo "$entry" | jq -r .file)
            tag="$id-v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$id $version is published; indexing the released jar"
              gh release download "$tag" --pattern "$file" --dir .index-jars --clobber
            else
              echo "$id $version has no tag yet; indexing the jar just built"
              cp "$id/build/sacred-mod/$file" .index-jars/
            fi
          done
          coderpack index --jars .index-jars
          rm -rf .index-jars .index-probe.json
          if git diff --quiet -- sacred.mods.repository.json; then
            echo "the index already described the published jars"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sacred.mods.repository.json
          git commit -m "Regenerate the mod index"
          # A push made with the workflow token starts no workflow run of its
          # own, so this cannot loop back into itself.
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Nothing may be pushed from a pull request, so there the index is only
      # generated, never compared. Comparing it would ask a contributor to
      # reproduce this runner's jars byte for byte, and self-check does not:
      # its jar came out eight bytes apart on a developer machine and on the
      # runner, which is what made the old --check step fail on work that was
      # perfectly correct. Generating still fails on the things a pull request
      # can genuinely get wrong: an unreadable registry.toml, a duplicate mod
      # id, a jar the linter refuses.
      - name: The index can be generated from the jars
        if: github.ref != 'refs/heads/master'
        run: coderpack index

      # One release per mod, tagged <id>-v<version>, which is exactly the URL
      # the index publishes. Nothing is released twice: the tag is the record,
      # and a push that changes no version publishes nothing.
      - name: Release what has a new version
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for id in $(jq -r '.mods[].id' sacred.mods.repository.json); do
            entry=$(jq -r ".mods[] | select(.id == \"$id\")" sacred.mods.repository.json)
            version=$(echo "$entry" | jq -r .version)
            file=$(echo "$entry" | jq -r .file)
            tag="$id-v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$tag is already published"
              continue
            fi
            gh release create "$tag" "$id/build/sacred-mod/$file" \
              --title "$id $version" \
              --notes "Install it from the launcher, or drop the jar in <Sacred Gold>/mods."
          done
